<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Dynamic Visualization</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        h2 {
            margin-bottom: 5px;
            color: #222;
        }
        p {
            margin: 5px 0 20px 0;
            color: #666;
            text-align: center;
            max-width: 600px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        canvas {
            border: 1px solid #e1e4e6;
            border-radius: 6px;
            background-color: #fafbfc;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            justify-content: center;
            font-weight: 600;
        }
        input[type="range"] {
            width: 200px;
            cursor: pointer;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 5px;
            font-size: 0.95em;
            background: #f1f3f5;
            padding: 8px 16px;
            border-radius: 20px;
        }
        .highlight {
            color: #d62728;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Interactive Geometric Construction</h2>
    <p>Drag the slider to change side length <b>a</b>. Notice that while the red triangle morphs, its calculated area stays perfectly constant!</p>

    <div class="container">
        <div class="controls">
            <label for="sideA">Side Length <i>a</i>: <span id="valA">4.0</span></label>
            <input type="range" id="sideA" min="1" max="10" step="0.1" value="4">
        </div>

        <canvas id="geoCanvas" width="550" height="400"></canvas>

        <div class="stats">
            <div>Left Square Side: <span id="statA">4.0</span></div>
            <div>Right Square Side: <b>6.0</b></div>
            <div>Triangle Area: <span class="highlight" id="statArea">18.00</span></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('geoCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('sideA');
        const valADisplay = document.getElementById('valA');
        const statADisplay = document.getElementById('statA');
        const statAreaDisplay = document.getElementById('statArea');

        // Coordinate transformation setup (Mapping math units to canvas pixels)
        // Let Origin (0,0) be near the bottom-center of the canvas
        const originX = 250;
        const originY = 320;
        const scale = 30; // 30 pixels per 1 math unit

        function drawPoint(x, y, label, color, alignX='right', alignY='bottom') {
            const cx = originX + x * scale;
            const cy = originY - y * scale; // invert Y for standard math orientation
            
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, 2 * Math.PI);
            ctx.fill();

            ctx.fillStyle = color;
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = alignX;
            ctx.textBaseline = alignY;
            
            const offsetX = alignX === 'right' ? -8 : 8;
            const offsetY = alignY === 'bottom' ? -8 : 12;
            ctx.fillText(label, cx + offsetX, cy + offsetY);
        }

        function drawGrid() {
            ctx.strokeStyle = '#e9ecef';
            ctx.lineWidth = 1;

            // Draw vertical grid lines
            for (let x = -10; x <= 10; x++) {
                const cx = originX + x * scale;
                ctx.beginPath();
                ctx.moveTo(cx, 0);
                ctx.lineTo(cx, canvas.height);
                ctx.stroke();
            }
            // Draw horizontal grid lines
            for (let y = -2; y <= 12; y++) {
                const cy = originY - y * scale;
                ctx.beginPath();
                ctx.moveTo(0, cy);
                ctx.lineTo(canvas.width, cy);
                ctx.stroke();
            }

            // Draw primary Axes
            ctx.strokeStyle = '#ced4da';
            ctx.lineWidth = 2;
            
            ctx.beginPath(); // X Axis
            ctx.moveTo(0, originY);
            ctx.lineTo(canvas.width, originY);
            ctx.stroke();

            ctx.beginPath(); // Y Axis
            ctx.moveTo(originX, 0);
            ctx.lineTo(originX, canvas.height);
            ctx.stroke();
        }

        function update() {
            const a = parseFloat(slider.value);
            
            // Sync text elements
            valADisplay.innerText = a.toFixed(1);
            statADisplay.innerText = a.toFixed(1);

            // Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background grid
            drawGrid();

            // --- 1. Draw Left Square (Blue) ---
            ctx.strokeStyle = 'rgba(31, 119, 180, 1)';
            ctx.fillStyle = 'rgba(31, 119, 180, 0.05)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.rect(originX - a * scale, originY - a * scale, a * scale, a * scale);
            ctx.fill();
            ctx.stroke();

            // --- 2. Draw Right Square (Green) ---
            ctx.strokeStyle = 'rgba(44, 160, 44, 1)';
            ctx.fillStyle = 'rgba(44, 160, 44, 0.05)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.rect(originX, originY - 6 * scale, 6 * scale, 6 * scale);
            ctx.fill();
            ctx.stroke();

            // --- 3. Compute Coordinates of Triangle Vertices ---
            const Ax = -a, Ay = a;
            const Bx = 0,  By = 6;
            const Cx = 6,  Cy = 0;

            // --- 4. Draw & Fill Target Triangle (Red dashed) ---
            ctx.strokeStyle = 'rgba(214, 39, 40, 1)';
            ctx.fillStyle = 'rgba(214, 39, 40, 0.15)';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([6, 4]); // Creates dashed line style
            
            ctx.beginPath();
            ctx.moveTo(originX + Ax * scale, originY - Ay * scale);
            ctx.lineTo(originX + Bx * scale, originY - By * scale);
            ctx.lineTo(originX + Cx * scale, originY - Cy * scale);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.setLineDash([]); // Reset to solid lines

            // --- 5. Annotate Critical Intersection Points ---
            drawPoint(Ax, Ay, `A (-${a.toFixed(1)}, ${a.toFixed(1)})`, '#d62728', 'right', 'bottom');
            drawPoint(Bx, By, 'B (0, 6)', '#2ca02c', 'left', 'bottom');
            drawPoint(Cx, Cy, 'C (6, 0)', '#2ca02c', 'left', 'top');
            drawPoint(0, 0, 'O (0,0)', '#495057', 'right', 'top');

            // --- 6. Calculate Shoelace Area Verification ---
            // Formula: 0.5 * abs(x1(y2-y3) + x2(y3-y1) + x3(y1-y2))
            const calculatedArea = 0.5 * Math.abs(Ax * (By - Cy) + Bx * (Cy - Ay) + Cx * (Ay - By));
            statAreaDisplay.innerText = calculatedArea.toFixed(2);
        }

        // Attach event listener to slider for real-time tracking
        slider.addEventListener('input', update);
        
        // Run initial draw frame on load
        update();
    </script>
</body>
</html>

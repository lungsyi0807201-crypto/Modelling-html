<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Pattern Explorer</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #e0e7ff;
      --secondary: #06b6d4;
      --secondary-light: #ecfeff;
      --neutral-dark: #1e293b;
      --neutral-light: #f8fafc;
      --border-color: #e2e8f0;
      --accent: #f59e0b;
      --accent-light: #fef3c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      color: var(--neutral-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      width: 100%;
      max-width: 900px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    header {
      text-align: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 20px;
    }

    header h1 {
      font-size: 2rem;
      color: var(--neutral-dark);
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 6px;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: #64748b;
      font-size: 0.95rem;
    }

    /* Controls Grid */
    .control-panel {
      background: var(--neutral-light);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .slider-label {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--neutral-dark);
    }

    .slider-value {
      background: var(--primary);
      color: white;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 1.1rem;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: #cbd5e1;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      transition: transform 0.1s ease, background-color 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      background: #4338ca;
    }

    .slider-limits {
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 600;
    }

    /* Stats Board */
    .data-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .data-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .data-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }

    .data-card.primary { border-top: 4px solid var(--primary); }
    .data-card.secondary { border-top: 4px solid var(--secondary); }
    .data-card.accent { border-top: 4px solid var(--accent); }

    .card-label {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }

    .card-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--neutral-dark);
    }

    .card-formula {
      font-size: 0.8rem;
      font-family: monospace;
      color: #94a3b8;
    }

    /* Equation Display */
    .equation-container {
      background: #0f172a;
      color: #f8fafc;
      border-radius: 16px;
      padding: 24px;
      box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
      position: relative;
      overflow-x: auto;
    }

    .equation-container::before {
      content: 'EQUATION FOR ROW N';
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 0.65rem;
      font-weight: 800;
      color: #475569;
      letter-spacing: 0.1em;
    }

    .equation-content {
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
      margin-top: 8px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .eq-lhs {
      color: #38bdf8;
    }

    .eq-rhs {
      color: #fb7185;
    }

    .eq-sign {
      color: #f1f5f9;
      padding: 0 8px;
    }

    /* Visualization Section */
    .visual-section {
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
    }

    .visual-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--neutral-dark);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .visual-legend {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    .legend-lhs { background-color: #38bdf8; }
    .legend-rhs { background-color: #fb7185; }

    #visual-canvas-container {
      width: 100%;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--neutral-light);
      border-radius: 12px;
      border: 1px dashed #cbd5e1;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    .bar {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bar-label {
      font-size: 10px;
      font-weight: bold;
      text-anchor: middle;
      fill: #475569;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Number Pattern Explorer</h1>
      <p>Discover Nicomachus' consecutive integer balance properties geometrically</p>
    </header>

    <!-- UI Slider Control -->
    <div class="control-panel">
      <div class="slider-header">
        <span class="slider-label">Select Row Number (N)</span>
        <span id="n-val-badge" class="slider-value">1</span>
      </div>
      <div class="slider-container">
        <span class="slider-limits">1</span>
        <input type="range" id="n-slider" min="1" max="100" value="1">
        <span class="slider-limits">100</span>
      </div>
    </div>

    <!-- Stats Board -->
    <div class="data-board">
      <div class="data-card primary">
        <span class="card-label">First Element</span>
        <span id="val-first" class="card-value">1</span>
        <span class="card-formula">N²</span>
      </div>
      <div class="data-card secondary">
        <span class="card-label">Total Elements</span>
        <span id="val-total" class="card-value">3</span>
        <span class="card-formula">2N + 1</span>
      </div>
      <div class="data-card accent">
        <span class="card-label">Last Element</span>
        <span id="val-last" class="card-value">3</span>
        <span class="card-formula">N² + 2N</span>
      </div>
    </div>

    <!-- Equation Display -->
    <div class="equation-container">
      <div class="equation-content" id="equation-display">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- Visualizer Container -->
    <div class="visual-section">
      <div class="visual-title">
        <span>Geometric Balance Visualization</span>
        <div class="visual-legend">
          <div class="legend-item">
            <div class="legend-color legend-lhs"></div>
            <span>LHS Sum (N + 1 terms)</span>
          </div>
          <div class="legend-item">
            <div class="legend-color legend-rhs"></div>
            <span>RHS Sum (N terms)</span>
          </div>
        </div>
      </div>
      <div id="visual-canvas-container">
        <svg id="visual-svg" viewBox="0 0 800 220" preserveAspectRatio="xMidYMid meet">
          <!-- Dynamic SVG content -->
        </svg>
      </div>
    </div>
  </div>

  <script>
    const slider = document.getElementById('n-slider');
    const nValBadge = document.getElementById('n-val-badge');
    const valFirst = document.getElementById('val-first');
    const valTotal = document.getElementById('val-total');
    const valLast = document.getElementById('val-last');
    const equationDisplay = document.getElementById('equation-display');
    const svg = document.getElementById('visual-svg');

    function update() {
      const n = parseInt(slider.value);
      
      // Calculate Math properties
      const first = n * n;
      const total = 2 * n + 1;
      const last = first + 2 * n;
      const mid = first + n; // Split element for LHS vs RHS (LHS ends here, RHS starts after)

      // Update UI Board
      nValBadge.textContent = n;
      valFirst.textContent = first.toLocaleString();
      valTotal.textContent = total.toLocaleString();
      valLast.textContent = last.toLocaleString();

      // Render Dynamic Equation
      let lhsHTML = '';
      let rhsHTML = '';

      if (n <= 5) {
        // Render full equation
        let lhsArr = [];
        for (let i = first; i <= mid; i++) {
          lhsArr.push(i);
        }
        let rhsArr = [];
        for (let i = mid + 1; i <= last; i++) {
          rhsArr.push(i);
        }
        lhsHTML = lhsArr.join(' + ');
        rhsHTML = rhsArr.join(' + ');
      } else {
        // Render abbreviated format using ellipses
        lhsHTML = `${first} + ${first + 1} + ... + ${mid}`;
        rhsHTML = `${mid + 1} + ... + ${last}`;
      }

      equationDisplay.innerHTML = `<span class="eq-lhs">${lhsHTML}</span> <span class="eq-sign">=</span> <span class="eq-rhs">${rhsHTML}</span>`;

      // Draw SVG visualization of balancing values
      renderSVG(n, first, mid, last);
    }

    function renderSVG(n, first, mid, last) {
      svg.innerHTML = ''; // Reset SVG

      const width = 800;
      const height = 220;
      const padding = 40;
      const plotWidth = width - 2 * padding;
      const plotHeight = height - 2 * padding;

      // We will show individual columns representing the numbers.
      // If N > 12, we show an aggregated visual with ellipses to avoid cluttered overlaps.
      let items = [];
      if (n <= 12) {
        // Show all bars
        for (let i = first; i <= last; i++) {
          items.push({ value: i, isLhs: i <= mid });
        }
      } else {
        // Abstracted rendering with transition
        // LHS Start, LHS End, RHS Start, RHS End
        items.push({ value: first, isLhs: true, label: first.toLocaleString() });
        items.push({ value: first + 1, isLhs: true, label: (first + 1).toLocaleString() });
        items.push({ isSpacer: true, isLhs: true });
        items.push({ value: mid, isLhs: true, label: mid.toLocaleString() });
        items.push({ value: mid + 1, isLhs: false, label: (mid + 1).toLocaleString() });
        items.push({ isSpacer: true, isLhs: false });
        items.push({ value: last - 1, isLhs: false, label: (last - 1).toLocaleString() });
        items.push({ value: last, isLhs: false, label: last.toLocaleString() });
      }

      const barCount = items.length;
      const gap = 8;
      const barWidth = (plotWidth - (barCount - 1) * gap) / barCount;

      // Calculate max and min values for scaling
      const maxVal = last;
      const minVal = Math.max(1, first - (last - first) * 0.2); // Elevate base so smaller differences look clearer

      items.forEach((item, index) => {
        const x = padding + index * (barWidth + gap);
        
        if (item.isSpacer) {
          // Draw ellipses placeholder text
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', x + barWidth / 2);
          text.setAttribute('y', height / 2);
          text.setAttribute('text-anchor', 'middle');
          text.setAttribute('fill', '#94a3b8');
          text.setAttribute('font-size', '20px');
          text.setAttribute('font-weight', 'bold');
          text.textContent = '...';
          svg.appendChild(text);
          return;
        }

        // Draw standard bar
        const normalizedHeight = ((item.value - minVal) / (maxVal - minVal + 1)) * (plotHeight - 30) + 20;
        const barHeight = Math.max(15, normalizedHeight);
        const y = height - padding - barHeight;

        // Create Container grouping to allow transitions
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

        // Draw Bar Rect
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x);
        rect.setAttribute('y', y);
        rect.setAttribute('width', barWidth);
        rect.setAttribute('height', barHeight);
        rect.setAttribute('rx', Math.min(6, barWidth / 3));
        rect.setAttribute('fill', item.isLhs ? '#38bdf8' : '#fb7185');
        rect.setAttribute('class', 'bar');
        
        // Value Label
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', x + barWidth / 2);
        text.setAttribute('y', y - 8);
        text.setAttribute('class', 'bar-label');
        text.setAttribute('font-size', n > 8 ? '8px' : '10px');
        text.textContent = item.label || item.value;

        g.appendChild(rect);
        g.appendChild(text);
        svg.appendChild(g);
      });

      // Draw a subtle baseline balance axis representing equilibrium
      const axis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      axis.setAttribute('x1', padding);
      axis.setAttribute('y1', height - padding + 4);
      axis.setAttribute('x2', width - padding);
      axis.setAttribute('y2', height - padding + 4);
      axis.setAttribute('stroke', '#cbd5e1');
      axis.setAttribute('stroke-width', '3');
      axis.setAttribute('stroke-linecap', 'round');
      svg.appendChild(axis);
    }

    // Interactive event listeners
    slider.addEventListener('input', update);
    window.addEventListener('resize', update);

    // Initial load
    update();
  </script>
</body>
</html>
